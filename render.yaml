services:
  - type: web
    name: growpath-commerical-frontend
    runtime: static
    buildCommand: npm run export:web:production
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20.19.4
      - key: EXPO_PUBLIC_API_URL
        value: https://api.growpathai.com
      - key: EXPO_PUBLIC_SENTRY_DSN
        sync: false
      - key: EXPO_PUBLIC_PRIVACY_URL
        value: https://growpathai.com/privacy
      - key: EXPO_PUBLIC_TERMS_URL
        value: https://growpathai.com/terms
      - key: EXPO_PUBLIC_SUPPORT_URL
        value: https://growpathai.com/support
      - key: EXPO_PUBLIC_DELETE_ACCOUNT_URL
        value: https://growpathai.com/account/delete
      - key: EXPO_PUBLIC_TWITCH_PARENT_HOST
        value: growpathai.com
    routes:
      - type: rewrite
        source: /home/*
        destination: /index.html
      - type: rewrite
        source: /videos/*
        destination: /index.html
      - type: rewrite
        source: /store/*
        destination: /index.html
      - type: rewrite
        source: /storefront/*
        destination: /index.html
      - type: rewrite
        source: /brands/*
        destination: /index.html
      - type: rewrite
        source: /forum/*
        destination: /index.html
      - type: rewrite
        source: /field-observations/*
        destination: /index.html
      - type: rewrite
        source: /facilities/*
        destination: /index.html
      - type: rewrite
        source: /alerts/*
        destination: /index.html
      - type: rewrite
        source: /tasks/*
        destination: /index.html
      - type: rewrite
        source: /logs/*
        destination: /index.html
      - type: rewrite
        source: /updates
        destination: /updates/index.html
      - type: rewrite
        source: /features
        destination: /features/index.html
      - type: rewrite
        source: /pricing
        destination: /pricing/index.html
      - type: rewrite
        source: /personal-grower
        destination: /personal-grower/index.html
      - type: rewrite
        source: /commercial-cultivation
        destination: /commercial-cultivation/index.html
      - type: rewrite
        source: /facility-management
        destination: /facility-management/index.html
      - type: rewrite
        source: /nurseries-breeders
        destination: /nurseries-breeders/index.html
      - type: rewrite
        source: /grow-stores
        destination: /grow-stores/index.html
      - type: rewrite
        source: /creators-educators
        destination: /creators-educators/index.html
      - type: rewrite
        source: /about
        destination: /about/index.html
      - type: rewrite
        source: /contact
        destination: /contact/index.html
      - type: rewrite
        source: /ai-cultivation-disclaimer
        destination: /ai-cultivation-disclaimer/index.html
      - type: rewrite
        source: /vs/plntrk
        destination: /vs/plntrk/index.html
      - type: rewrite
        source: /vs/grow-with-jane
        destination: /vs/grow-with-jane/index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /_expo/static/js/*
        name: Cache-Control
        value: public, max-age=0, s-maxage=0, must-revalidate
